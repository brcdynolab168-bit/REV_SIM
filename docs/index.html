<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Rev Lab - ห้องทดลองเครื่องยนต์</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b0d10'/%3E%3Cpath d='M10 44a22 22 0 1 1 44 0' fill='none' stroke='%23ffa21a' stroke-width='6' stroke-linecap='round'/%3E%3Cpath d='M32 44 44 24' stroke='%23ffa21a' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash">
  <div class="splash-box">
    <h1>REV LAB</h1>
    <p>ห้องทดลองเครื่องยนต์ 1 สูบ 4 จังหวะ<br>ออกแบบเครื่อง • ไดโน • ทดสอบวิ่ง • ที่ปรึกษาจูน</p>
    <button id="startBtn" class="big">แตะเพื่อเริ่ม (เปิดเสียง)</button>
    <p class="dim small" id="splashMsg">แนะนำให้เปิดเสียงและใช้หูฟัง • มือถือแนวนอนจะเล่นง่ายที่สุด</p>
  </div>
</div>

<header>
  <b class="logo">REV LAB</b>
  <span id="toast" class="toast"></span>
  <span class="grow"></span>
  <span id="topinfo" class="dim small"></span>
</header>

<main>
  <section id="v-home" class="view"></section>
  <section id="v-test" class="view" hidden></section>
  <section id="v-garage" class="view" hidden></section>
  <section id="v-adv" class="view" hidden></section>
  <section id="v-set" class="view" hidden></section>
</main>

<nav id="nav">
  <div class="side-logo"><b class="logo">REV LAB</b><span class="dim small">ห้องทดลองเครื่องยนต์</span></div>
  <button data-v="home" class="on"><span>ภาพรวม</span><small>OVERVIEW</small></button>
  <button data-v="garage"><span>อู่ออกแบบ</span><small>WORKSHOP</small></button>
  <button data-v="test"><span>ห้องทดสอบ</span><small>TEST BENCH</small></button>
  <button data-v="adv"><span>ที่ปรึกษา</span><small>ADVISOR</small></button>
  <button data-v="set"><span>ตั้งค่า</span><small>SETTINGS</small></button>
  <div class="side-info" id="sideInfo"></div>
</nav>

<div id="modal" hidden>
  <div class="modal-box">
    <div class="row"><h2 id="mTitle">ผลวัดไดโน</h2><span class="grow"></span><button id="mClose">ปิด</button></div>
    <canvas id="mChart"></canvas>
    <div id="mBody"></div>
  </div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
